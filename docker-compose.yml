# One command starts the whole application:   docker compose up --build
# Then open http://localhost:3000  (API docs: http://localhost:8000/docs)
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro        # ONNX models (see README: download_models)
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
  # Optional: experiment-tracking UI over the recorded MLflow database
  #   docker compose --profile tracking up mlflow      ->  http://localhost:5000
  mlflow:
    profiles: ["tracking"]
    image: python:3.11-slim
    command: sh -c "pip install -q mlflow && mlflow server --backend-store-uri sqlite:////data/mlflow.db --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./experiments:/data

