# One command starts the whole application:   docker compose up --build
# Then open http://localhost:3000  (API docs: http://localhost:8000/docs)
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro        # ONNX models (see README: download_models)
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
